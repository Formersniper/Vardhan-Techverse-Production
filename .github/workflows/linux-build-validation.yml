name: Linux Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_COMPANY_ID: ${{ secrets.NEXT_PUBLIC_DEFAULT_COMPANY_ID }}

      - name: Verify exported RSC payloads
        shell: bash
        run: |
          test -f "out/growthforge/__next.growthforge.__PAGE__.txt"
          test -f "out/contact/__next.contact.__PAGE__.txt"
          test -f "out/real-estate/__next.real-estate.__PAGE__.txt"
          test -f "out/automation/__next.automation.__PAGE__.txt"
          test -f "out/privacy/__next.privacy.__PAGE__.txt"
          test -f "out/terms/__next.terms.__PAGE__.txt"
          test -f "out/admin/__next.admin.__PAGE__.txt"
          test -f "out/admin/login/__next.admin.login.__PAGE__.txt"

          echo "All expected flat RSC payloads are present."

      - name: Validate Linux artifact over HTTP
        shell: bash
        run: |
          python3 -m http.server 4173 --directory out > /tmp/http-server.log 2>&1 &
          SERVER_PID=$!

          trap 'kill $SERVER_PID' EXIT

          sleep 2

          curl -fsS -o /dev/null "http://127.0.0.1:4173/growthforge/__next.growthforge.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/contact/__next.contact.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/real-estate/__next.real-estate.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/automation/__next.automation.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/privacy/__next.privacy.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/terms/__next.terms.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/admin/__next.admin.__PAGE__.txt"
          curl -fsS -o /dev/null "http://127.0.0.1:4173/admin/login/__next.admin.login.__PAGE__.txt"

          echo "All Linux RSC payloads returned HTTP 200."

      - name: Upload Linux static export
        uses: actions/upload-artifact@v4
        with:
          name: vardhan-linux-static-export
          path: out
          if-no-files-found: error
