# Supabase Project Configuration (V1.0 Architecture Freeze)
project_id = "vardhan-techverse"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://vardhantechverse.com"]
jwt_expiry = 3600
enable_signup = false # Strict invite/admin provisioning only

[edge_runtime]
enabled = true
port = 54323
policy = "per_worker"

[storage]
enabled = false
